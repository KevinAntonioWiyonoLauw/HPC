name: sika

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sika-backend:latest
    container_name: sika-backend
    environment:
      - DATA_DIR=/app/data
      - STATE_DIR=/app/state
      - OMP_NUM_THREADS=4
      # Mode muat basis: preload (baca penuh ke RAM) atau mmap (petakan berkas).
      - SIKA_LOAD_MODE=${SIKA_LOAD_MODE:-preload}
      # Batas konkurensi (0 = tanpa batas). GPU sebaiknya serial (1).
      - SIKA_MAX_CONCURRENCY=${SIKA_MAX_CONCURRENCY:-1}
      - SIKA_MAX_EMBED_CONCURRENCY=${SIKA_MAX_EMBED_CONCURRENCY:-4}
      # Warmup startup: full (embedding+engine) | engine | none (percepat start).
      - SIKA_WARMUP=${SIKA_WARMUP:-full}
      # Provider LLM OpenAI-compatible. Di dalam container, host Windows/WSL
      # diakses via host.docker.internal (bukan localhost).
      - LLM_BASE_URL=${LLM_BASE_URL_DOCKER:-http://host.docker.internal:12800/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-cb/auto}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-60}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-512}
    volumes:
      # korpus + data (read-only). Dibangun via scripts/build_corpus.py
      - ./data:/app/data:ro
      # state runtime (konfigurasi provider LLM) agar bertahan antar restart
      - ./state:/app/state
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: sika-web:latest
    container_name: sika-web
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
